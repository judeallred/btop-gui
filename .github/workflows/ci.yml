name: CI

# Every push to main and every pull request runs the tests and builds a universal
# NoBeachballs.app, attached to the run as a downloadable artifact.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: UNIVERSAL=1 scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/NoBeachballs.app "build/NoBeachballs-$(scripts/version.sh)-${GITHUB_SHA::7}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoBeachballs-app
          path: build/NoBeachballs-*.zip
          if-no-files-found: error
